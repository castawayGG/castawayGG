<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: white; font-family: system-ui, sans-serif; }
        .input-dark { background: #111; border: 1px solid #333; outline: none; transition: 0.2s; }
        .input-dark:focus { border-color: #3b82f6; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-10">
            <div class="w-12 h-12 bg-blue-600 rounded-xl mx-auto mb-4 flex items-center justify-center shadow-[0_0_30px_rgba(37,99,235,0.3)]">
                <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">System Login</h1>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-6 p-4 rounded-xl text-sm text-center border {% if category=='error' %}bg-red-900/20 text-red-500 border-red-900/50{% else %}bg-zinc-900 border-zinc-800 text-zinc-400{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <input type="text" name="username" placeholder="Логин" required class="input-dark w-full px-4 py-3 rounded-xl text-sm">
            <input type="password" name="password" placeholder="Пароль" required class="input-dark w-full px-4 py-3 rounded-xl text-sm">
            <input type="text" name="otp" placeholder="2FA код (если включен)" class="input-dark w-full px-4 py-3 rounded-xl text-sm font-mono tracking-widest text-center">
            
            <button type="submit" class="w-full bg-white text-black font-semibold py-3 rounded-xl hover:bg-gray-200 transition mt-4">
                ВОЙТИ
            </button>
        </form>
    </div>
</body>
</html>
